name: OptiMouse validation
on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python
        run: python3 -m py_compile optimouse.py cursor_resizer.py plugin/cursor-bridge.py
      - name: Verify application version and standalone timing label
        run: |
          python3 optimouse.py --version | grep -x 'OptiMouse 0.2.8'
          python3 - <<'PY'
          from pathlib import Path
          source=Path('optimouse.py').read_text()
          assert "timing.set_text(f'Apply time: {seconds:.2f} s')" in source
          assert "status.set_max_width_chars(66)" in source
          assert "GLib.idle_add(finish,message,time.monotonic()-started,phases)" in source
          assert "breakdown.set_text(" in source
          assert "source_signature(" in source
          assert "memoryview(data)[start:stop].cast('I')" in source
          assert "if sys.byteorder=='little':" in source
          assert "def prepare_custom_theme(color):" in source
          assert "threading.Lock()" in source
          assert "queue_colour_preload()" in source
          assert "sync_gtk_cursor_settings(theme,size)" in source
          assert "prepare_cursor_choice(options)" in source
          assert "size.connect('value-changed',queue_colour_preload)" in source
          assert "from cursor_resizer import sized_theme, cursor_visible_height" in source
          assert "drawn=cursor_visible_height(_theme,options['size'],ICONS)" in source
          # The previous self-managed Gtk.ColorButton popup could appear in
          # the screen's top-left on Hyprland. A transient modal dialog must
          # belong to the settings window and keep Cancel non-destructive.
          assert "Gtk.ColorButton()" not in source
          assert "Gtk.ColorChooserDialog(title='Choose pointer colour')" in source
          assert "dialog.set_transient_for(win)" in source
          assert "dialog.set_modal(True)" in source
          assert "dialog.set_position(Gtk.WindowPosition.CENTER_ON_PARENT)" in source
          assert "if dialog.run()==Gtk.ResponseType.OK:" in source
          assert "colour_state['rgba']=dialog.get_rgba()" in source
          assert "colour_state['rgba'].parse(DEFAULT['color'])" in source
          print('Apply timing visibility checks passed.')
          PY
      - name: Test optimized colour, preparation races and GTK settings
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate installer
        run: bash -n install.sh
      - name: Validate plugin manifest
        run: python3 -m json.tool plugin/manifest.json
      - name: Check expected service wiring
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("plugin/manifest.json").read_text())
          assert manifest["entryPoints"]["service"]=="Service.qml"
          assert manifest["id"]=="io.github.robbieuk1.optimouse-shake"
          service=Path("plugin/Service.qml").read_text()
          for required in ('settings.json','preview_token','shake_max','follow_theme','CursorArrow','cursor hide'):
              assert required in service, required
          assert "omarchroma" not in Path("optimouse.py").read_text().lower()
          installer=Path("install.sh").read_text()
          assert 'install -m644 "$STAGING/cursor_resizer.py" "$APP/cursor_resizer.py"' in installer
          assert 'omarchy plugin enable "$PLUGIN_ID"' in installer
          assert 'omarchy plugin enable "$PLUGIN_ID" --yes' not in installer
          assert 'omarchy plugin list --json' in installer
          assert '.enabled == true' in installer
          assert "cursorStroke = root.selectedColor" in service
          assert "root.cursorStroke = parts[2]" not in service
          assert "interval: 100" in service
          assert "interval: 500" not in service
          from importlib.util import module_from_spec, spec_from_file_location
          spec=spec_from_file_location("optimouse",Path("optimouse.py"))
          app=module_from_spec(spec)
          spec.loader.exec_module(app)
          from unittest.mock import patch
          opts=dict(app.DEFAULT,follow_theme=False,size=48,color="#71FACC")
          def common_mocks():
              return [
                  patch.object(app, "prepare_cursor_choice", return_value=("OptiMouse-Sized-OptiMouse-71FACC-48",True)),
                  patch.object(app, "sync_gtk_cursor_settings"),
                  patch.object(app, "persist_cursor"),
                  patch.object(app, "checked"),
                  patch.object(app.shutil, "which", return_value="/usr/bin/tool"),
                  patch.object(app.time,"time_ns",return_value=123456789000000),
              ]
          from contextlib import ExitStack
          with ExitStack() as stack:
              for m in common_mocks(): stack.enter_context(m)
              stack.enter_context(patch.object(app,"overlay_running",return_value=True))
              save=stack.enter_context(patch.object(app,"write_settings"))
              checked=stack.enter_context(patch.object(app,"checked"))
              result=app.apply(opts)
              assert checked.call_args_list[0].args[0]==["hyprctl","setcursor","OptiMouse-Sized-OptiMouse-71FACC-48","48"]
              assert sum(1 for c in checked.call_args_list if c.args[0][0]=="hyprctl")==1
              assert result[:2]==("OptiMouse-Sized-OptiMouse-71FACC-48",True)
              assert all(key in result[2] for key in ("theme","save","hyprland","gtk","preview"))
              saved=save.call_args.args[0]
              assert saved["preview_token"]=="123456789000000"
              assert saved["size"]==48 and saved["color"]=="#71FACC"
              assert "preview_token" not in opts
          with ExitStack() as stack:
              for m in common_mocks(): stack.enter_context(m)
              stack.enter_context(patch.object(app,"overlay_running",return_value=False))
              save=stack.enter_context(patch.object(app,"write_settings"))
              result=app.apply(opts)
              assert result[:2]==("OptiMouse-Sized-OptiMouse-71FACC-48",False)
              assert save.call_args.args[0]==opts
          # A previously generated colour should reuse its complete theme.
          from tempfile import TemporaryDirectory
          with TemporaryDirectory() as temp:
              from pathlib import Path
              source=Path(temp)/"source"
              source.mkdir()
              (source/"left_ptr").write_bytes(b"base-data")
              target=Path(temp)/"icons"
              target.mkdir()
              with patch.object(app,"ICONS",target), patch.object(app,"base_theme",return_value=source):
                  with patch.object(app,"tint_xcursor",side_effect=lambda raw,rgb: b"tinted:"+raw) as tint:
                      assert app.create_theme("#AABBCC")=="OptiMouse-AABBCC"
                      assert (target/"OptiMouse-AABBCC"/"cursors"/"left_ptr").read_bytes()==b"tinted:base-data"
                      assert tint.call_count==1
                      assert app.create_theme("#AABBCC")=="OptiMouse-AABBCC"
                      assert tint.call_count==1, "Existing colour unexpectedly regenerated"
                      (source/"left_ptr").write_bytes(b"updated-cursor-content")
                      assert app.create_theme("#AABBCC")=="OptiMouse-AABBCC"
                      assert tint.call_count==2, "Modified base cursor was not regenerated"
          print("Cursor colour cache and source-change invalidation passed.")
          assert "refresh_cursor_visibility" not in Path("optimouse.py").read_text()
          assert "refresh_cursor_across_outputs" not in Path("optimouse.py").read_text()
          print("Apply dispatches existing Preview path after cursor settings are applied.")
          print("Static checks passed.")
          PY
